name: Build Sayan Music & Movies APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  android:
    name: Compile and sign installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout entire Android project
        uses: actions/checkout@v4

      - name: Check repository folder structure
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle || { echo '::error::Upload the FILES INSIDE the ZIP to the repository root; settings.gradle is missing.'; exit 1; }
          test -f build.gradle || { echo '::error::Root build.gradle is missing.'; exit 1; }
          test -f app/build.gradle || { echo '::error::app/build.gradle is missing.'; exit 1; }
          echo 'Android project root verified.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check or install Android API 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            sdkmanager 'platforms;android-35'
          fi
          if [ ! -f "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            sdkmanager 'build-tools;35.0.0'
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          echo 'Android API 35 ready.'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug-signed installable APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload Android 16 testing APK
        uses: actions/upload-artifact@v4
        with:
          name: Sayan-Music-Movies-Installable-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Optional: only if you add all 4 SAYAN_... GitHub repository secrets.
      - name: Prepare optional release signing key
        id: release_key
        shell: bash
        env:
          B64: ${{ secrets.SAYAN_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.SAYAN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAYAN_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SAYAN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$B64" | base64 --decode > "$RUNNER_TEMP/sayan_release.jks"
            chmod 600 "$RUNNER_TEMP/sayan_release.jks"
            echo "SAYAN_KEYSTORE=$RUNNER_TEMP/sayan_release.jks" >> "$GITHUB_ENV"
            echo "SAYAN_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "SAYAN_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SAYAN_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No permanent release key configured; debug APK is already signed and installable.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build permanently release-signed APK (optional)
        if: steps.release_key.outputs.ready == 'true'
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Upload release-signed APK (optional)
        if: steps.release_key.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sayan-Music-Movies-Signed-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
