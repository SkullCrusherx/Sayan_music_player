plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sayanlodh.mediabox'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sayanlodh.mediabox'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Optional release signing: set SAYAN_KEYSTORE, SAYAN_STORE_PASSWORD,
    // SAYAN_KEY_ALIAS, and SAYAN_KEY_PASSWORD in the build environment.
    signingConfigs {
        release {
            if (System.getenv('SAYAN_KEYSTORE')) {
                storeFile file(System.getenv('SAYAN_KEYSTORE'))
                storePassword System.getenv('SAYAN_STORE_PASSWORD')
                keyAlias System.getenv('SAYAN_KEY_ALIAS')
                keyPassword System.getenv('SAYAN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('SAYAN_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.8.2'
    def media3Version = '1.5.1'
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
}
